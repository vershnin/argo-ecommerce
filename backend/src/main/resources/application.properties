# Load environment variables from backend/.env when present
spring.config.import=optional:dotenv:.

# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/argo_ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:argo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:argo_secret_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
# IMPORTANT: Use a strong secret in production
# Generate with: openssl rand -base64 32
app.jwt.secret=${APP_JWT_SECRET:dev-secret-key-change-in-production-env-only}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Storage config
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.storage.local.path=${APP_STORAGE_PATH:${user.home}/argo-uploads}

# S3 config (only used with s3 profile)
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_S3_REGION:us-east-1}
app.storage.s3.base-url=${AWS_S3_BASE_URL:}

# Mail
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.default-encoding=UTF-8

# Notifications
app.notifications.enabled=${APP_NOTIFICATIONS_ENABLED:false}
app.notifications.from=${APP_NOTIFICATIONS_FROM:no-reply@argo.com}

# Logging
logging.level.com.argo=DEBUG
logging.level.org.springframework.security=INFO
