# Server
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/argo_ecommerce
spring.datasource.username=argo
spring.datasource.password=argo_secret_123
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
# IMPORTANT: Replace with a strong 256-bit base64 secret in production
# Generate with: openssl rand -base64 64
app.jwt.secret=argo-ecommerce-super-secret-key-change-this-in-production-use-256bit-minimum
app.jwt.expiration-ms=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:8080,http://localhost:3000

# Logging
logging.level.com.argo=DEBUG
logging.level.org.springframework.security=INFO
