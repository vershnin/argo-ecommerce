version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: argo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: argo_ecommerce
      POSTGRES_USER: argo
      POSTGRES_PASSWORD: argo_secret_123
    ports:
      - "5432:5432"
    volumes:
      - argo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argo -d argo_ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: argo_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/argo_ecommerce
      SPRING_DATASOURCE_USERNAME: argo
      SPRING_DATASOURCE_PASSWORD: argo_secret_123
      APP_JWT_SECRET: dev-secret-key-change-in-production-env-only
      APP_BASE_URL: http://localhost:8080
      APP_STORAGE_PATH: /var/lib/argo-uploads
    depends_on:
      - postgres
    volumes:
      - argo_backend_uploads:/var/lib/argo-uploads

volumes:
  argo_postgres_data:
  argo_backend_uploads:
